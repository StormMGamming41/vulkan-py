[project]
name = "vulkan_py"
version = "1.0.0"
description = "Actual ultimate Python binding for Vulkan after the realitix project went cold. This package supports lastest release of the Vulkan SDK and API, and require zero dependencies"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }

authors = [
    { name = "StormMGamming41" }
]

keywords = [
    "vulkan",
    "python",
    "ctypes",
    "bindings",
    "code-generation",
    "api",
    "vulkan api"
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: API :: Vulkan",
]

[project.optional-dependencies]
examples = [
    "glfw>=2.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vulkan_py = ["*.py"]